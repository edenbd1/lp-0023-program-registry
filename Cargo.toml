[package]
name        = "lez-registry-core"
version     = "0.1.0"
edition     = "2021"
license     = "MIT OR Apache-2.0"
description = "Registry entry types, PDA derivation and build-verification logic for the LEZ program registry. No dependencies, no I/O, so the on-chain program and the CLI agree by construction."

[dependencies]
sha2  = { version = "0.10", default-features = false }
borsh = { version = "1.0", default-features = false, features = ["derive"] }

[dev-dependencies]

[profile.release]
overflow-checks = true
