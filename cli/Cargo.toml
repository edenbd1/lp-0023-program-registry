[package]
name    = "lez-registry-cli"
version = "0.3.0"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "Register, update, look up, search and verify programs in the Provenance registry on LEZ v0.3."

[[bin]]
name = "lez-registry"
path = "src/main.rs"

[dependencies]
lez-registry-core = { path = ".." }
lez-registry-sdk  = { path = "../sdk" }
sha2        = "0.10"
serde_json  = "1"
# Computes a built guest's ImageID the way the loader does. The version is the
# one LEZ v0.3.0 locks.
risc0-binfmt = "=3.0.4"

[profile.release]
overflow-checks = true
