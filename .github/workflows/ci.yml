name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  core:
    name: Build, lint and test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable

      # The gate is behaviour, not style: the build and the tests below decide
      # whether this is green. Formatting and lints are the developer's job
      # before a commit (`cargo fmt`, `cargo clippy`), not a reason for a
      # correct commit to go red on a newer toolchain's taste.

      # Release, not debug: the release profile sets overflow-checks = true, so
      # a missed checked_* panics here rather than wrapping on chain. Testing in
      # debug would exercise different arithmetic from the one that ships.
      - name: Tests
        run: cargo test --release --verbose

      # The core links into a RISC-V guest, which has no std. Building for a
      # no_std target is the only way to find out that something pulled it in —
      # `cargo test` runs on the host and would never notice.
      - name: The core still builds without std
        run: |
          rustup target add thumbv7em-none-eabi
          cargo build --release --target thumbv7em-none-eabi

      # The CLI, SDK, indexer and program are separate workspaces, so none of
      # the steps above touches them. A green tick that covered only the core
      # while the README pointed at four crates would be worse than no tick.
      - name: The other crates, built and tested
        run: |
          for crate in cli sdk indexer explorer; do
            echo "::group::$crate"
            cargo test --release --manifest-path "$crate/Cargo.toml"
            echo "::endgroup::"
          done

      # The program is a RISC0 guest: `risc0_zkvm::guest::entry!(main)` only
      # resolves when it is built as the guest binary, so `cargo test` cannot
      # build it and its absence from the loop above is deliberate. Building it
      # still catches every type error the instructions can have.
      - name: The guest program compiles
        run: |
          cargo build --release --manifest-path program/Cargo.toml

      # Scripts are deliverables here, not glue: verify-onchain.sh and demo.sh
      # are how a reader checks the claims. A syntax error in one is a broken
      # claim.
      - name: Shell scripts parse
        run: |
          for s in scripts/*.sh scripts/sealed/docker; do
            bash -n "$s" || exit 1
          done

  # A separate job so a sequencer outage reads as "the network was down" rather
  # than as "the code is broken". It is required rather than optional: a skipped
  # integration test is an integration test that did not run, and reporting
  # green for it would be reporting something untrue.
  e2e:
    name: End to end against a real sequencer
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain
        run: rustup toolchain install stable --profile minimal && rustup default stable

      # --ignored, not --include-ignored: these are the only tests this job
      # exists to run, and a pass that came from the unit tests would hide a
      # sequencer that answered nothing.
      - name: Read the live registry
        run: cargo test --release --manifest-path sdk/Cargo.toml -- --ignored --nocapture

      - name: Re-check every claim in DEPLOYMENTS.md
        run: ./scripts/verify-onchain.sh

  # Criterion 27: the demo runs, unmodified, from a clean clone on both macOS and
  # Linux. It is read-only against the public testnet, so it doubles as a
  # cross-platform smoke test of the CLI the demo drives.
  demo:
    name: Demo runs from a clean clone (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain
        run: rustup toolchain install stable --profile minimal && rustup default stable
      - name: Demo, unmodified
        run: ./scripts/demo.sh
