name: CI

on:
  push:
    branches: [main, v0.3]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  # LEZ v0.3.0, the version every crate here and the guest target.
  LEZ_COMMIT: db66590ab821a4e142c211017a3866d007f6fa77

jobs:
  core:
    name: Build and test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain
        run: rustup toolchain install stable --profile minimal && rustup default stable

      # Release, not debug: the release profile sets overflow-checks = true, so
      # the arithmetic tested is the arithmetic that ships.
      - name: Core tests
        run: cargo test --release

      # The core links into a RISC-V guest with no std; a no_std target is the
      # only way to notice something pulled std in.
      - name: The core builds without std
        run: |
          rustup target add thumbv7em-none-eabi
          cargo build --release --target thumbv7em-none-eabi

      # Includes sdk/tests/idl_drift.rs: the hand-maintained IDL against the
      # instruction enum, through SPEL's own IDL types.
      - name: SDK, CLI, indexer, explorer
        run: |
          for crate in sdk cli indexer explorer; do
            echo "::group::$crate"
            cargo test --release --manifest-path "$crate/Cargo.toml"
            echo "::endgroup::"
          done

      # The guest only links as a RISC0 binary, but a host build type-checks
      # every instruction against lee_core v0.3.0.
      - name: The guest type-checks against lee_core v0.3.0
        run: cargo build --release --manifest-path program/Cargo.toml

      - name: Shell scripts parse
        run: |
          for s in scripts/*.sh scripts/sealed/docker; do bash -n "$s" || exit 1; done

  # The full lifecycle against a real LEZ v0.3.0 sequencer in standalone mode,
  # RISC0_DEV_MODE=0: deploy, register in itself, the refused deployer entry,
  # third-party entries, update, mismatch, stale, freeze, discovery, and the
  # SDK's e2e tests. Required, not optional.
  e2e:
    name: End to end against a local LEZ v0.3.0 sequencer
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
      - name: System packages
        run: sudo apt-get update && sudo apt-get install -y clang pkg-config libssl-dev protobuf-compiler cmake
      - name: Toolchain
        run: rustup toolchain install stable --profile minimal && rustup default stable
      - name: RISC0 toolchain
        run: |
          curl -L https://risczero.com/install | bash
          echo "$HOME/.risc0/bin" >> "$GITHUB_PATH"
          "$HOME/.risc0/bin/rzup" install
      - name: LEZ v0.3.0
        run: |
          git clone --quiet https://github.com/logos-blockchain/logos-execution-zone _external/lez
          git -C _external/lez checkout --quiet "$LEZ_COMMIT"
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            _external/lez/target
          key: lez-${{ env.LEZ_COMMIT }}-${{ runner.os }}
      - name: Standalone sequencer and wallet
        working-directory: _external/lez
        run: |
          cargo build --release -p sequencer_service --features standalone
          cargo build --release -p wallet
      - name: The lifecycle
        env:
          LEZ_SRC: ${{ github.workspace }}/_external/lez
          REBUILD: "1"
        run: ./scripts/e2e-v03-local.sh
