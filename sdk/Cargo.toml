[package]
name = "lez-registry-sdk"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "Resolve and read LEZ program registry entries without an index."

[dependencies]
lez-registry-core = { path = ".." }
borsh = { version = "1", features = ["derive"] }
sha2 = "0.10"
ureq = "2"
serde_json = "1"

[profile.release]
overflow-checks = true
