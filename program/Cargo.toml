# The Provenance registry guest, for LEZ v0.3.0.
#
# Written against lee_core directly. The prize names SPEL as the framework, and
# the v0.2.4 build of this program used it; SPEL has no release that targets
# LEZ v0.3 yet (its latest, v0.7.0-rc.2, still pins v0.2.4), so this guest uses
# the runtime's own plan/apply entry points and keeps an IDL in SPEL's format by
# hand. See the README, "Why the IDL is hand-maintained".
#
# lee_core is pinned by the v0.3.0 tag's commit, not the tag name, so a moved
# tag cannot change what this builds against.
[workspace]

[package]
name    = "lez-registry-guest"
version = "0.3.0"
edition = "2021"
license = "MIT OR Apache-2.0"
publish = false

[[bin]]
name = "lez_registry"
path = "src/bin/lez_registry.rs"

[dependencies]
lee_core          = { git = "https://github.com/logos-blockchain/logos-execution-zone.git", rev = "db66590ab821a4e142c211017a3866d007f6fa77" }
risc0-zkvm        = { version = "=3.0.5", default-features = false, features = ["std"] }
lez-registry-core = { path = ".." }
borsh             = { version = "1.5", default-features = false, features = ["derive"] }

[profile.release]
opt-level     = 3
lto           = "thin"
codegen-units = 1
panic         = "abort"
overflow-checks = true
